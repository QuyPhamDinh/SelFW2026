name: Main Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test -Denv=ci -Dheadless=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-test-reports
          path: target/
