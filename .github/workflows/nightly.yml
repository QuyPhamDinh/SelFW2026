name: Nightly Regression

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test -Denv=ci -Dheadless=true -Dcucumber.filter.tags="not @wip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-reports
          path: target/
