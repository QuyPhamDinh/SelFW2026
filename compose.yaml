services:
  selenium:
    image: selenium/standalone-chromium:4.25.0-20241010
    shm_size: 2gb
    ports:
      - "4444:4444"
    environment:
      SE_NODE_MAX_SESSIONS: "4"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:4444/status | grep -Eq '\"ready\"[[:space:]]*:[[:space:]]*true'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - test-network

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      selenium:
        condition: service_healthy
    environment:
      TEST_ENV: "${TEST_ENV:-ci}"
      SELENIUM_REMOTE_URL: "http://selenium:4444"
    command: ["-B", "test", "-Denv=ci", "-Dheadless=true"]
    volumes:
      - ./target:/workspace/target
      - ./allure-results:/workspace/allure-results
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
